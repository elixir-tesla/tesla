version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7

  - package-ecosystem: mix
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7
    groups:
      prod:
        dependency-type: production
      dev:
        dependency-type: development
    ignore:
      - dependency-name: "ibrowse"
        versions: ["4.4.1"]
